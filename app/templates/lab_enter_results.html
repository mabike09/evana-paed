{% extends "base.html" %}
{% block title %}Enter Lab Results{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-2">
  <h1 class="h5 mb-0">Lab Order #{{ order.id }}</h1>
  <div class="ms-auto d-flex gap-2">
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('lab.lab_queue') }}">Back to Lab Queue</a>
    <a class="btn btn-sm btn-outline-secondary"
       href="{{ url_for('lab.patient_lab_history', patient_id=order.patient_id) }}">View Previous Results</a>
  </div>
</div>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="table-responsive">
    <table class="table table-sm">
      <thead><tr><th>Test</th><th>Value</th><th>Notes</th></tr></thead>
      <tbody>
        {% for ln in lines %}
          <tr>
            <td>
              {{ ln.test_name }}
              <input type="hidden" name="line_id[]" value="{{ ln.id }}">
            </td>
            <td><input class="form-control form-control-sm" name="result_value[]" value="{{ ln.result_value or '' }}"></td>
            <td><textarea class="form-control form-control-sm" name="result_text[]" rows="1">{{ ln.result_text or '' }}</textarea></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="d-flex justify-content-end gap-2 mt-3">
    <button class="btn btn-success btn-sm">Save Results</button>
  <a class="btn btn-outline-secondary btn-sm" target="_blank" href="{{ print_url }}">Print Results</a>
  </div>
</form>
{% endblock %}
