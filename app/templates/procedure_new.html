{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">New Procedure</h4>
<form method="POST">
  {{ form.hidden_tag() }}
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">{{ form.code.label }}</label>
      {{ form.code(class="form-control") }}
    </div>
    <div class="col-md-6">
      <label class="form-label">{{ form.name.label }}</label>
      {{ form.name(class="form-control") }}
    </div>
    <div class="col-md-3">
      <label class="form-label">{{ form.default_price.label }}</label>
      {{ form.default_price(class="form-control") }}
    </div>
  </div>
  <div class="mt-3 d-flex gap-2">
    {{ form.submit(class="btn btn-primary") }}
    <a class="btn btn-outline-secondary" href="{{ url_for('billing_prices') }}">Cancel</a>
  </div>
</form>
{% endblock %}
