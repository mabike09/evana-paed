              <form method="post" action="{{ url_for('finance.ap_bill_edit', bill_id=bill.id) }}" class="mb-1">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if return_to_supplier|default(false) %}<input type="hidden" name="return_to_supplier" value="1">{% endif %}
                <input class="form-control form-control-sm mb-1" type="date" name="due_date" aria-label="Due date" value="{{ bill.due_date }}">
                <input class="form-control form-control-sm mb-1" name="description" aria-label="Description" value="{{ bill.description or '' }}">
                <input class="form-control form-control-sm mb-1" type="number" step="0.01" name="invoice_total" aria-label="Invoice total" value="{{ bill.invoice_total }}">
                <input class="form-control form-control-sm mb-1" type="number" step="0.01" name="tax_amount" aria-label="Tax amount" value="{{ bill.tax_amount }}">
                <select class="form-select form-select-sm mb-1" name="expense_category" aria-label="Expense category">{% for c in expense_categories %}<option value="{{ c }}" {% if bill.expense_category == c %}selected{% endif %}>{{ c|title }}</option>{% endfor %}</select>
                <button class="btn btn-sm btn-outline-warning w-100" type="submit">Edit</button>
              </form>
              <form method="post" action="{{ url_for('finance.ap_bill_delete', bill_id=bill.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if return_to_supplier|default(false) %}<input type="hidden" name="return_to_supplier" value="1">{% endif %}
                <button class="btn btn-sm btn-outline-danger w-100" type="submit" onclick="return confirm('Delete this invoice?')">Delete</button>
              </form>
