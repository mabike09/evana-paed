{% extends "base.html" %}{% block content %}<h1>Payroll periods</h1><form method="post" class="row g-2 mb-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-3"><input name="period_month" type="month" class="form-control" required></div><div class="col-md-4"><input name="name" class="form-control" placeholder="January 2026 payroll"></div><div class="col-md-3"><input name="revenue" type="number" step="0.01" class="form-control" placeholder="Revenue"></div><div class="col-auto"><button class="btn btn-primary">Create</button></div></form><table class="table"><tr><th>Period</th><th>Month</th><th>Status</th><th>Revenue</th></tr>{% for p in periods %}<tr><td><a href="{{ url_for('payroll.period_detail', period_id=p.id) }}">{{ p.name }}</a></td><td>{{ p.period_month }}</td><td>{{ p.status }}</td><td>{{ p.revenue }}</td></tr>{% endfor %}</table>{% endblock %}
